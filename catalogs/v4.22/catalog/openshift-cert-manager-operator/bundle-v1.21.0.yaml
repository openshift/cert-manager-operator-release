              "name": "tls-cert-sample",
              "namespace": "default"
            },
            "spec": {
              "commonName": "sample.dns.name",
              "dnsNames": [
                "sample.dns.name"
              ],
              "issuerRef": {
                "kind": "Issuer",
                "name": "letsencrypt-staging"
              },
              "request": "XXX"
            }
          },
          {
            "apiVersion": "cert-manager.io/v1",
            "kind": "Certificate",
            "metadata": {
              "name": "selfsigned-ca",
              "namespace": "default"
            },
            "spec": {
              "commonName": "selfsigned-ca.dns.name",
              "isCA": true,
              "issuerRef": {
                "group": "cert-manager.io",
                "kind": "ClusterIssuer",
                "name": "ca-cluster-issuer"
