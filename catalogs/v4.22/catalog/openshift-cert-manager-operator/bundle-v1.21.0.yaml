            "spec": {
              "allowed": {
                "commonName": {
                  "required": true,
                  "value": "hello.world"
                }
              },
              "selector": {
                "issuerRef": {}
              }
            }
          },
          {
            "apiVersion": "trust.cert-manager.io/v1alpha1",
            "kind": "Bundle",
            "metadata": {
              "name": "example-bundle"
            },
            "spec": {
              "sources": [
