            "apiVersion": "cert-manager.io/v1",
            "kind": "Issuer",
            "metadata": {
              "name": "letsencrypt-staging",
              "namespace": "default"
            },
            "spec": {
              "acme": {
                "email": "aos-ci-cd@redhat.com",
                "privateKeySecretRef": {
                  "name": "letsencrypt-staging"
