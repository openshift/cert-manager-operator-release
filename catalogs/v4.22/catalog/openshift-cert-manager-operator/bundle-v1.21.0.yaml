    apiServiceDefinitions: {}
    crdDescriptions:
      owned:
      - description: |-
          ApproverPolicyManager describes the desired configuration and observed state of approver-policy.
          The name must be 'cluster', allowing only one instance per cluster.
        displayName: ApproverPolicyManager
        kind: ApproverPolicyManager
        name: approverpolicymanagers.operator.openshift.io
        version: v1alpha1
      - description: A Bundle is used to distribute trust bundles across a Kubernetes
          cluster.
        displayName: Bundle
        kind: Bundle
        name: bundles.trust.cert-manager.io
        version: v1alpha1
      - description: |-
          A CertificateRequestPolicy describes a policy profile that approver-policy
          uses to approve or deny applicable CertificateRequests.
        displayName: CertificateRequestPolicy
        kind: CertificateRequestPolicy
        name: certificaterequestpolicies.policy.cert-manager.io
        version: v1alpha1
      - description: |-
          A CertificateRequest is used to request a signed certificate from one of the
          configured issuers.

          All fields within the CertificateRequest's `spec` are immutable after creation.
          A CertificateRequest will either succeed or fail, as denoted by its `Ready` status
          condition and its `status.failureTime` field.

          A CertificateRequest is a one-shot resource, meaning it represents a single
          point in time request for a certificate and cannot be re-used.
        displayName: CertificateRequest
        kind: CertificateRequest
        name: certificaterequests.cert-manager.io
        version: v1
      - description: |-
          A Certificate resource should be created to ensure an up to date and signed
          X.509 certificate is stored in the Kubernetes Secret resource named in `spec.secretName`.

          The stored certificate will be renewed before it expires (as configured by `spec.renewBefore`).
        displayName: Certificate
        kind: Certificate
        name: certificates.cert-manager.io
        version: v1
      - description: CertManager is the Schema for the certmanagers API
        displayName: CertManager
        kind: CertManager
        name: certmanagers.operator.openshift.io
        version: v1alpha1
      - description: Challenge is a type to represent a Challenge request with an
          ACME server
        displayName: Challenge
        kind: Challenge
        name: challenges.acme.cert-manager.io
        version: v1
      - description: |-
          A ClusterIssuer represents a certificate issuing authority which can be
          referenced as part of `issuerRef` fields.
          It is similar to an Issuer, however it is cluster-scoped and therefore can
          be referenced by resources that exist in *any* namespace, not just the same
          namespace as the referent.
        displayName: ClusterIssuer
        kind: ClusterIssuer
        name: clusterissuers.cert-manager.io
        version: v1
      - description: |-
          HTTP01Proxy describes the configuration for the HTTP01 challenge proxy that redirects
          traffic from the API endpoint on port 80 to ingress routers.
          The name must be 'cluster' to make HTTP01Proxy a singleton, allowing only one instance per cluster.
          When an HTTP01Proxy is created, a MachineConfig with nftables DNAT/SNAT rules is applied to control plane nodes.
          Creating, re-rendering, or deleting that MachineConfig causes a rolling drain and reboot of the control plane nodes.
        displayName: HTTP01Proxy
        kind: HTTP01Proxy
        name: http01proxies.operator.openshift.io
        version: v1alpha1
      - description: |-
          An Issuer represents a certificate issuing authority which can be
          referenced as part of `issuerRef` fields.
          It is scoped to a single namespace and can therefore only be referenced by
          resources within the same namespace.
        displayName: Issuer
        kind: Issuer
        name: issuers.cert-manager.io
        version: v1
      - description: |-
          IstioCSR describes the configuration and information about the managed istio-csr agent.
          The name must be `default` to make IstioCSR a singleton that is, to allow only one instance of IstioCSR per namespace.

          When an IstioCSR is created, istio-csr agent is deployed in the IstioCSR-created namespace.
        displayName: IstioCSR
        kind: IstioCSR
        name: istiocsrs.operator.openshift.io
        version: v1alpha1
      - description: Order is a type to represent an Order with an ACME server
        displayName: Order
        kind: Order
        name: orders.acme.cert-manager.io
        version: v1
      - description: |-
          TrustManager describes the configuration and information about the managed trust-manager deployment.
          The name must be 'cluster' to make TrustManager a singleton, allowing only one instance per cluster.
          When a TrustManager is created, trust-manager is deployed in the cert-manager namespace.
        displayName: TrustManager
        kind: TrustManager
        name: trustmanagers.operator.openshift.io
        version: v1alpha1
    description: |
      The cert-manager Operator for Red Hat OpenShift provides seamless support for [cert-manager v1.21.3](https://github.com/cert-manager/cert-manager/tree/v1.21.3), which automates certificate management.
      For more information, see the [cert-manager Operator for Red Hat OpenShift documentation](https://docs.openshift.com/container-platform/latest/security/cert_manager_operator/index.html).
    displayName: cert-manager Operator for Red Hat OpenShift
    installModes:
    - supported: true
      type: OwnNamespace
    - supported: true
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
    keywords:
    - cert-manager
    - cert-manager-operator
