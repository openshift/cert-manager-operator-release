      alm-examples: |-
        [
          {
            "apiVersion": "acme.cert-manager.io/v1",
            "kind": "Challenge",
            "metadata": {
              "name": "tls-cert-sample",
              "namespace": "default"
            },
            "spec": {
              "authorizationURL": "https://acme-staging-v02.api.letsencrypt.org/acme/authz-v3/XXXXX",
              "dnsName": "sample.dns.name",
              "issuerRef": {
                "kind": "Issuer",
                "name": "letsencrypt-staging"
              },
              "key": "XXX",
              "solver": {
                "dns01": {
                  "route53": {
