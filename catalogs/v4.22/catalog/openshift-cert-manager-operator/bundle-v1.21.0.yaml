                "server": "https://acme-staging-v02.api.letsencrypt.org/directory",
                "solvers": [
                  {
                    "dns01": {
                      "route53": {
                        "accessKeyID": "ACCESS_KEY_ID",
                        "hostedZoneID": "HOSTED_ZONE_ID",
                        "region": "AWS_REGION",
                        "secretAccessKeySecretRef": {
                          "key": "access-key",
                          "name": "sample-aws-secret"
                        }
                      }
                    },
                    "selector": {
                      "dnsNames": [
                        "sample.dns.name"
                      ]
                    }
                  }
                ]
              }
            }
          },
          {
            "apiVersion": "operator.openshift.io/v1alpha1",
            "kind": "ApproverPolicyManager",
            "metadata": {
              "name": "cluster"
            },
            "spec": {
              "approverPolicyConfig": {}
            }
          },
          {
            "apiVersion": "operator.openshift.io/v1alpha1",
            "kind": "CertManager",
            "metadata": {
              "name": "cluster"
            },
            "spec": {
              "logLevel": "Normal",
              "managementState": "Managed"
            }
          },
          {
            "apiVersion": "operator.openshift.io/v1alpha1",
            "kind": "IstioCSR",
            "metadata": {
              "annotations": {
                "kubernetes.io/description": "Resource behavior is managed through IstioCSR featuregate, which is enabled by default. Please refer to the cert-manager documentation for more information on the istio-csr feature."
