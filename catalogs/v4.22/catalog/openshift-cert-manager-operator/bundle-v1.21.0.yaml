            "apiVersion": "cert-manager.io/v1",
            "kind": "Issuer",
            "metadata": {
              "name": "ca-issuer",
              "namespace": "default"
            },
            "spec": {
              "ca": {
                "secretName": "ca-root-secret"
              }
            }
          },
